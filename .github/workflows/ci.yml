name: CI

on:
  # ⛔ PUSHES ONLY ON main, AND THE REASON IS MEASURED. With a bare `push:` every commit
  # on a branch that has an open pull request ran this whole matrix TWICE -- once for the
  # push and once for the pull_request -- so a single mistake sent TWO failure emails and
  # burned double the minutes. A branch with a PR is already covered by the PR run; main
  # keeps its own run so a merge is still checked.
  push:
    branches: [main]
  pull_request:

# ⛔ LEAST PRIVILEGE, SET EXPLICITLY. Without this block GitHub hands every job a token with
# WRITE access to this repository, so any dependency that runs during a build -- a test plugin, a
# transitive package -- could push a commit. Nothing here needs to write anything.
permissions:
  contents: read

jobs:
  test:
    # ⭐ THREE OPERATING SYSTEMS, not one. Added 2026-09-27 after a sibling repo shipped three
    # Windows-only defects that a green ubuntu-only matrix could not see: a path written with
    # backslashes read as clean, an 8.3 short name breaking a lookup chain, and a location string
    # carrying os.sep. Nothing in this repo is known to be platform-sensitive -- which is exactly
    # the claim a matrix is for, since "I read the code and it looks portable" is not a measurement.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      # ⛔ THIS JOB INSTALLED NOTHING UNTIL 2026-09-27, AND HAD BEEN RED SINCE THE TEST SUITE
      # LANDED. `tests/test_properties.py` imports hypothesis, so `unittest discover` could not even
      # LOAD it and reported `test_properties ... ERROR` -- on every OS and every Python version.
      # The suite passes on a developer machine where hypothesis happens to be installed, which is
      # exactly why nobody noticed: the failure lived only in the empty environment CI actually has.
      - name: Install the test dependencies the repo declares
        run: python -m pip install --upgrade pip ".[test]"
      - name: Run the test suite
        run: python -m pytest -q
      - name: Run the demo
        run: python -m corral demo

  install:
    # ⛔ THIS JOB EXISTS BECAUSE THE SUITE ABOVE CANNOT SEE THE ONE FAILURE THAT MATTERED MOST.
    # Until 2026-09-27 this repo had no pyproject.toml at all, so `pip install` failed outright --
    # and CI was green the whole time, because the tests run from the source tree where imports
    # work anyway. The tests prove the CODE is right; this proves the INSTALLED PACKAGE is right,
    # which is the only thing a stranger who downloads it ever touches.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package the way a stranger would
        run: python -m pip install .
      - name: The console command exists and answers
        run: corral --help
      # `cd ..` on purpose: from the repo root the source tree is importable whether or not the
      # install worked, so a doctor run there would pass on a broken wheel.
      - name: The install verifies itself, from outside the source tree
        run: corral doctor
        working-directory: ..

  security:
    # ⛔ A DEPENDENCY AUDIT, RUN ON EVERY PUSH. A tool whose job is finding defects that hide is
    # not allowed to ship with a known-vulnerable dependency chain; and the honest place to learn
    # that is here, on every change, rather than from whoever downloads it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install this package and the auditor
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pip-audit
      - name: Audit the installed dependency chain
        # ⛔ NO `--strict`, AND THE REASON IS NOT LAXITY. `--strict` fails the run when
        # pip-audit cannot RESOLVE a package on PyPI, and this package is not published -- so the
        # job went red reporting "dependency not found on PyPI" as though it were an advisory.
        # An actual vulnerability still exits non-zero without the flag, which is the property
        # this job exists for.
        run: python -m pip_audit --progress-spinner off
