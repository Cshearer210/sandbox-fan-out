version: 2
updates:
  # Keep GitHub Actions used by the CI workflow up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # ⛔ ONE PR, NOT EIGHT. Ungrouped, dependabot opened a separate pull request per dependency
      # -- eight at once on 2026-09-27 -- each running the full multi-OS matrix and each capable
      # of failing on its own. Grouping makes it one PR, one matrix, one verdict to read.
      all-updates:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  # The package has no runtime dependencies; this covers the dev/CI tooling
  # (coverage, hypothesis, ruff) if a requirements file is added later.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # ⛔ ONE PR, NOT EIGHT. Ungrouped, dependabot opened a separate pull request per dependency
      # -- eight at once on 2026-09-27 -- each running the full multi-OS matrix and each capable
      # of failing on its own. Grouping makes it one PR, one matrix, one verdict to read.
      all-updates:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"
