version: 2
updates:
  # Keep GitHub Actions used by the CI workflow up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  # The package has no runtime dependencies; this covers the dev/CI tooling
  # (coverage, hypothesis, ruff) if a requirements file is added later.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"
